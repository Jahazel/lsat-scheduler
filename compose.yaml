services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: drillmap
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drillmap"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
