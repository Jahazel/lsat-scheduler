name: Factory worker

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to work (0 runs the smoke test only)
        type: number
        default: 0

permissions:
  contents: read

jobs:
  worker:
    uses: Jahazel/software-factory/.github/workflows/worker.yml@main
    with:
      setup: .factory/setup.sh
      proof: .factory/smoke.sh
      proof-path: .verification/evidence/
      rules: .factory/worker-rules.md
      issue: ${{ inputs.issue }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
