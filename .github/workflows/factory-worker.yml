name: Factory worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    uses: Jahazel/software-factory/.github/workflows/worker.yml@main
    with:
      setup: .factory/setup.sh
      proof: .factory/smoke.sh
      proof-path: .verification/evidence/
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
