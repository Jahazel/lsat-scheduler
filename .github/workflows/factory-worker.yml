name: Factory worker

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to work (0 runs the smoke test only)
        type: number
        default: 0

# The agent's job reads with these. A separate publish job writes with FACTORY_GITHUB_TOKEN.
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  worker:
    uses: Jahazel/software-factory/.github/workflows/worker.yml@main
    # The factory worker reads .factory/setup.sh, .factory/smoke.sh, and .factory/worker-rules.md.
    with:
      issue: ${{ inputs.issue }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
