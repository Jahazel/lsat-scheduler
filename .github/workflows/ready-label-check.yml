name: Ready label check

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to check now, with no wait
        type: number
        required: true

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue || github.event.issue.number }}
    steps:
      - name: Wait 10 minutes for the author to add a label or sub-issues
        if: github.event_name == 'issues'
        run: sleep 600

      - name: Add ready-for-human when the issue has no ready label
        run: |
          read -r state is_pr subissues has_ready_label < <(gh api "repos/$GH_REPO/issues/$ISSUE" --jq '[
            .state,
            (.pull_request != null),
            (.sub_issues_summary.total // 0),
            ([.labels[].name] | any(. == "ready-for-agent" or . == "ready-for-human"))
          ] | @tsv')
          echo "Issue #$ISSUE: state=$state pull-request=$is_pr sub-issues=$subissues ready-label=$has_ready_label"
          if [ "$state" != "open" ] || [ "$is_pr" = "true" ] || [ "$subissues" != "0" ] || [ "$has_ready_label" = "true" ]; then
            echo "No change needed."
            exit 0
          fi
          gh issue edit "$ISSUE" --add-label ready-for-human
          gh issue comment "$ISSUE" --body "This issue had no ready label, so the ready label check added \`ready-for-human\`. Change it to \`ready-for-agent\` if an agent can do this work. Adding \`ready-for-agent\` starts a factory run. See \`docs/agents/triage-labels.md\`."
