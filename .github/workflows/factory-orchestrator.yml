name: Factory orchestrator

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  orchestrate:
    # Only the owner's agent:implement label starts a run. Other label changes, such as the
    # worker's agent:blocked, use no job computer.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'agent:implement' && github.event.sender.login == github.repository_owner)
    uses: Jahazel/software-factory/.github/workflows/orchestrator.yml@main
    with:
      cap: 1
      dry-run: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
