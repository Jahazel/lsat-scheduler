name: Factory orchestrator

on:
  issues:
    types: [labeled, unlabeled]
  # Main moved, so open factory PRs are behind it. Strict required checks block them until main is merged in.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      trigger-label:
        description: Label that starts work
        default: ready-for-agent
      dry-run:
        description: Show what the run would start without starting it
        type: boolean
        default: false

# The orchestrator claims and releases labels and starts itself again with github.token.
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

jobs:
  orchestrate:
    # A label event starts a run only when the owner adds ready-for-agent, or removes agent:blocked
    # to retry. Other label changes, such as the worker's agent:blocked, use no job computer.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.sender.login == github.repository_owner && (
        (github.event.action == 'labeled' && github.event.label.name == 'ready-for-agent') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'agent:blocked')))
    uses: Jahazel/software-factory/.github/workflows/orchestrator.yml@main
    with:
      cap: 1
      trigger-label: ${{ inputs.trigger-label || 'ready-for-agent' }}
      dry-run: ${{ inputs.dry-run == true }}
      # Where a merge conflict goes to a worker. Any other conflict blocks the PR.
      agent-conflicts: migrations/
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
