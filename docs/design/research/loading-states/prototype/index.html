<!doctype html>
<!--
  PROTOTYPE, throw away. Loading states (#637).
  Frame: the screen at desktop (1440), tablet (768) and phone (390) at full size. The Screen switch shows one at a time; desktop is the default.
  The picker switches the variants of the section under review. Keys: 1-3, arrows, R replays the load.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Loading states</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1F1F1F; color: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.top { height: 52px; flex-wrap: nowrap; white-space: nowrap; overflow-x: auto; padding: 0 24px; display: flex; align-items: center; gap: 16px; font-size: 13px; border-bottom: 1px solid #333; position: sticky; left: 0; }
.top b { font-weight: 600; }
.top span { color: #A0A0A0; }
.seg { display: flex; padding: 2px; border-radius: 8px; background: #333; }
.seg button { border: 0; background: none; color: #A0A0A0; font: inherit; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #FAFAFA; color: #111; }
.load { margin-left: auto; }
.stage { height: calc(100% - 52px); overflow: auto; padding: 24px 24px 96px; }
.row { display: flex; gap: 32px; align-items: flex-start; width: max-content; }
.device { flex-shrink: 0; }
.device[hidden] { display: none; }
.single .row { margin: 0 auto; }
.device p { margin: 0 0 8px; font-size: 12px; color: #A0A0A0; font-variant-numeric: tabular-nums; }
.device iframe { display: block; border: 0; background: #F6F6F6; border-radius: 6px; box-shadow: 0 0 0 1px #000; }

.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>
</head>
<body>
<div class="top">
  <b>Loading states</b><span>Sections 1–4 picked: Sweep, Mirror, Ring, Loop</span>
  <select id="page" aria-label="Page" style="font:inherit;background:#333;color:#FAFAFA;border:0;border-radius:8px;padding:6px 8px">
    <option value="reading">Screenshot reading (section 4)</option><option value="buttons">Buttons (section 3)</option><option value="week">This week</option><option value="upload">Weekly upload</option><option value="progress">Progress</option><option value="progress-week">Progress · One week</option><option value="settings">Study settings</option><option value="account">Account</option>
    <option value="admin">Admin · All students</option><option value="admin-student">Admin · One student</option><option value="onboarding">Onboarding</option>
  </select>
  <div class="seg load" role="group" aria-label="Load time">
    <button data-load="fast">Fast (0.1 s)</button><button data-load="typical">Typical (1.4 s)</button><button data-load="slow">Slow (5 s)</button><button data-load="hold">Hold</button>
  </div>
  <div class="seg" role="group" aria-label="Data">
    <button data-data="demo">Demo data</button><button data-data="worst">Worst case</button><button data-data="sparse">Sparse</button>
  </div>
  <div class="seg" role="group" aria-label="Screen">
    <button data-size="desktop">Desktop</button><button data-size="tablet">Tablet</button><button data-size="phone">Phone</button>
  </div>
  <div class="seg" role="group" aria-label="Motion">
    <button data-rm="0">Full motion</button><button data-rm="1">Reduced motion</button>
  </div>
</div>
<div class="stage">
  <div class="row">
    <div class="device" data-device="desktop"><p>Desktop · 1440</p><iframe title="Desktop" width="1440" height="900"></iframe></div>
    <div class="device" data-device="tablet"><p>Tablet · 768</p><iframe title="Tablet" width="768" height="1024"></iframe></div>
    <div class="device" data-device="phone"><p>Phone · 390</p><iframe title="Phone" width="390" height="844"></iframe></div>
  </div>
</div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Loop</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const frames = [...document.querySelectorAll("iframe")];
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
const replay = picker.querySelector(".proto-picker-replay");
const variants = items.length;
const url0 = new URLSearchParams(location.search);
let current = 0;
let load = url0.get("load") || "typical";
let rm = url0.get("rm") || (matchMedia("(prefers-reduced-motion: reduce)").matches ? "1" : "0");
let size = ["desktop", "tablet", "phone"].includes(url0.get("size")) ? url0.get("size") : "desktop";
let data = url0.get("data") || "demo";
let pageName = url0.get("page") || "reading";
const pageSelect = document.getElementById("page");
pageSelect.value = pageName;
pageSelect.addEventListener("change", () => { pageName = pageSelect.value; mount(); });

function showSize() {
  document.querySelectorAll("[data-device]").forEach((d) => { d.hidden = d.dataset.device !== size; });
  document.querySelector(".stage").classList.add("single");
  document.querySelectorAll("[data-size]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.size === size)));
  const url = new URL(location);
  url.searchParams.set("size", size);
  history.replaceState(null, "", url);
}

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount() {
  const file = { buttons: "buttons", reading: "reading" }[pageName] || "screen";
  const q = `${file}.html?v=${current + 1}&load=${load}&rm=${rm}&data=${data}&page=${pageName}&t=${Date.now()}`;
  frames.forEach((f) => { f.src = q; });
  document.querySelectorAll("[data-load]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.load === load)));
  document.querySelectorAll("[data-rm]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.rm === rm)));
  document.querySelectorAll("[data-data]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.data === data)));
  const url = new URL(location);
  url.searchParams.set("v", current + 1);
  url.searchParams.set("load", load);
  url.searchParams.set("rm", rm);
  url.searchParams.set("size", size);
  url.searchParams.set("data", data);
  url.searchParams.set("page", pageName);
  history.replaceState(null, "", url);
}

function setActive(i) {
  if (i < 0 || i >= variants) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
  moveHighlight();
  mount();
}

items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay.addEventListener("click", mount);
window.addEventListener("resize", moveHighlight);
document.querySelectorAll("[data-load]").forEach((b) => b.addEventListener("click", () => { load = b.dataset.load; mount(); }));
document.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => { rm = b.dataset.rm; mount(); }));
document.querySelectorAll("[data-data]").forEach((b) => b.addEventListener("click", () => { data = b.dataset.data; mount(); }));
document.querySelectorAll("[data-size]").forEach((b) => b.addEventListener("click", () => { size = b.dataset.size; showSize(); }));

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % variants);
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants) % variants);
  else if (e.key === "r" || e.key === "R") mount();
});

setActive((parseInt(url0.get("v"), 10) || 1) - 1);
showSize();
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
</body>
</html>
