<!doctype html>
<!--
  PROTOTYPE, throw away. Loading states (#637), section 4: the screenshot reading bar.
  The onboarding Analytics step and the Weekly upload 7Sage analytics group, each with an LR and an RC screenshot row.
  ?load=fast|typical|slow|hold sets how long a read takes. ?data=demo|worst|sparse. ?rm=1 reduced motion.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · Screenshot reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --vellum: #F6F6F6; --paper: #FFFFFF; --line: #E4E4E4; --ink: #0A0A0A; --chalk: #FAFAFA;
  --fog: #8A8A8A; --smoke: #5C5C5C; --accent: #123A94; --success-ink: #1F7A34; --danger: #F0524F; --danger-ink: #C23532;
  --fast: 120ms; --base: 200ms; --slow: 320ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1); --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out-strong: cubic-bezier(0.77, 0, 0.175, 1);
  font-family: Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--vellum); color: var(--ink); }
html { -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.small:active, .where button:active { background: var(--vellum); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 48px 72px 160px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.where { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--smoke); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.where button { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 13px; font-weight: 500; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.tagline { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fog); }
.card h2 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em; }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
.card h3 span { font-weight: 400; font-size: 14px; color: var(--smoke); font-variant-numeric: tabular-nums; }
.card p { margin: 0; color: var(--smoke); font-size: 14px; line-height: 20px; }
.rows { display: flex; flex-direction: column; gap: 12px; }

/* FileRow, as in src/components/ui/FileRow.tsx */
.file { position: relative; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow: hidden; transition: border-color var(--base) ease; }
.file[data-tone="danger"] { border-color: var(--danger); }
.top { display: flex; align-items: center; gap: 16px; }
.thumb { display: flex; height: 48px; width: 64px; flex-shrink: 0; flex-direction: column; justify-content: center; gap: 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--vellum); padding: 8px; }
.thumb i { display: block; height: 3px; border-radius: 2px; background: rgb(10 10 10 / 0.2); }
.thumb i:first-child { background: rgb(10 10 10 / 0.3); }
.meta { display: flex; min-width: 0; flex-grow: 1; flex-direction: column; gap: 2px; font-size: 14px; line-height: 20px; }
.meta b { font-weight: 500; overflow-wrap: anywhere; }
.detail { display: flex; min-width: 0; align-items: center; gap: 6px; color: var(--smoke); }
.detail[data-s="reading"] { color: var(--accent); }
.detail[data-s="problem"] { color: var(--danger-ink); }
/* A long file name truncates; the status after it always stays readable and wraps to its own line when the name needs the room. */
/* One line: the file name gives way first, the short status stays whole. A long problem sentence gets its own line. */
.detail { flex-wrap: wrap; column-gap: 0; row-gap: 0; }
.detail svg { margin-right: 6px; }
.detail .name { flex: 0 1 auto; min-width: 0; max-width: calc(100% - 18px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail .st { flex-shrink: 0; white-space: nowrap; }
.detail .st.long { flex-basis: 100%; white-space: normal; }
.detail { flex-wrap: nowrap; }
.detail:has(.long) { flex-wrap: wrap; }
.detail svg { width: 12px; height: 12px; flex-shrink: 0; }
.glyph-spin { animation: turn 900ms linear infinite; }
@keyframes turn { to { rotate: 360deg; } }
.replace { flex-shrink: 0; background: none; border: 0; padding: 0; font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.small { height: 40px; align-self: flex-start; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); padding: 0 18px; font-size: 14px; font-weight: 500; }

/* The area under the top line: bar, long-read note, problem buttons. It opens and closes by grid rows, so the row grows and shrinks smoothly. */
.under { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--base) var(--ease-standard); }
.under > div { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.file[data-open] .under { grid-template-rows: 1fr; }
.under .pad { height: 2px; flex-shrink: 0; }
.note { font-size: 14px; line-height: 20px; color: var(--smoke); opacity: 0; transition: opacity var(--base) ease; }
.note[data-on] { opacity: 1; }
.note:empty { display: none; }
.problem { display: flex; flex-wrap: wrap; gap: 8px; }
.problem:empty { display: none; }

/* Section 4 pick, Loop: a short segment slides across the track again and again until the read ends.
   Only transform and opacity animate. */
.track { position: relative; height: 4px; border-radius: 2px; background: var(--vellum); overflow: hidden; flex-shrink: 0; }
.seg, .full { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px; background: var(--accent); }
.seg { width: 36%; transform: translateX(-100%); }
.file[data-phase="reading"] .seg { animation: loop 1400ms var(--ease-in-out-strong) infinite; }
@keyframes loop { from { transform: translateX(-100%); } to { transform: translateX(280%); } }
/* Done: a full fill grows from the left under the segment, and the segment fades. */
.full { right: 0; transform-origin: left center; transform: scaleX(0); }
.file[data-phase="done"] .full { transform: scaleX(1); transition: transform var(--base) var(--ease-out-strong); }
.file[data-phase="done"] .seg { opacity: 0; transition: opacity var(--fast) ease; }
/* Connection lost: the segment stops where it is and turns grey. */
.file[data-stuck] .seg { background: var(--fog); }

/* Reduced motion: no sliding. A still, faint full bar shows the read is running; done fills it without a tween. */
@media (prefers-reduced-motion: reduce) { .seg, .full { animation: none !important; transition: none !important; } .file[data-phase="reading"] .seg { width: 100%; transform: none; opacity: 0.35; } .glyph-spin { animation: none; } .under { transition: none; } }
[data-rm] .seg, [data-rm] .full { animation: none !important; transition: none !important; }
[data-rm] .file[data-phase="reading"] .seg { width: 100%; transform: none; opacity: 0.35; }
[data-rm] .glyph-spin { animation: none; }
[data-rm] .under { transition: none; }

/* The two places sit side by side only on desktop; each is its own page in the app. */
@media (max-width: 1023px) { .wrap { grid-template-columns: minmax(0, 1fr); padding: 48px 32px 120px; } }
@media (max-width: 767px) {
  .wrap { grid-template-columns: minmax(0, 1fr); padding: 24px 20px 120px; gap: 16px; }
  .card { padding: 20px; }
  .thumb { display: none; }
}
</style>
</head>
<body>
<main class="wrap">
  <div class="where"><span>Each pair reads by itself. The frame's load time sets how long a read takes.</span><button id="again">Read again</button></div>

  <section class="card">
    <span class="tagline">Onboarding · Step 3 of 4</span>
    <h2>Add your 7Sage analytics</h2>
    <p>Two screenshots, or the same values typed by you, tell us what to drill first.</p>
    <div class="rows" data-group="onboarding"></div>
    <p>We keep your screenshots only until we read them.</p>
  </section>

  <section class="card">
    <span class="tagline">Weekly upload</span>
    <h3>7Sage analytics <span data-count="upload"></span></h3>
    <div class="rows" data-group="upload"></div>
  </section>
</main>

<script>
const params = new URLSearchParams(location.search);
const LOAD = params.get("load") || "typical";
const DATA = params.get("data") || "demo";
const RM = params.get("rm") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
if (params.get("rm") === "1") document.documentElement.dataset.rm = "";

const LONG_READ = 10000, LIMIT = 30000;
// How each read ends, in ms after it starts. "lost" and "timeout" are failures.
const SECONDS = { fast: [800, 1200], typical: [5000, 6500], slow: [14000, 17000], hold: [Infinity, Infinity] }[LOAD];
const PLAN = {
  demo: [{ s: "LR", file: "lr-analytics.png", ms: SECONDS[0], rows: 12 }, { s: "RC", file: "rc-analytics.png", ms: SECONDS[1], rows: 4, queue: true }],
  worst: [
    { s: "LR", file: "Screenshot 2026-11-05 at 9.41.27 PM (2).png", ms: LIMIT, end: "timeout" },
    { s: "RC", file: "IMG_20261105_214127_HDR-edited-final.png", ms: 4200, end: "lost", queue: true },
  ],
  sparse: [{ s: "LR", file: "lr.png", ms: 90, rows: 1 }, { s: "RC", file: "rc.png", ms: 140, rows: 1 }],
}[DATA];

const NAME = { LR: "Logical Reasoning", RC: "Reading Comprehension" };
const NOUN = { LR: "question type", RC: "passage type" };
const ICON = {
  clock: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.75" fill="none" stroke="#8A8A8A" stroke-width="1.3"/><path d="M6 3.5V6l1.6 1" fill="none" stroke="#8A8A8A" stroke-width="1.3" stroke-linecap="round"/></svg>',
  spin: '<svg class="glyph-spin" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.6"/><path d="M6 1.5a4.5 4.5 0 0 1 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  check: '<svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#1F7A34" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

let timers = [];
const later = (fn, ms) => { if (ms !== Infinity) timers.push(setTimeout(fn, ms)); };

function rowHtml(r) {
  return `<div class="file" data-phase="waiting">
    <div class="top">
      <span class="thumb" aria-hidden="true"><i style="width:36px"></i><i style="width:44px"></i><i style="width:28px"></i><i style="width:40px"></i></span>
      <div class="meta"><b>${NAME[r.s]}</b><span class="detail" aria-live="polite"></span></div>
      <button class="replace" type="button">Replace</button>
    </div>
    <div class="under"><div>
      <span class="pad" aria-hidden="true"></span>
      <div class="track" role="progressbar" aria-label="Reading your ${NAME[r.s]} screenshot"><div class="full"></div><div class="seg"></div></div>
      <p class="note"></p>
      <div class="problem"></div>
    </div></div>
  </div>`;
}

function setDetail(el, kind, text, icon) {
  const d = el.querySelector(".detail");
  d.dataset.s = kind;
  const [name, status] = text.split(" · ");
  d.innerHTML = `${icon ? ICON[icon] : ""}<span class="name">${name}</span>${status.length > 24 ? `<span class="st long">${status}</span>` : `<span class="st">&nbsp;· ${status}</span>`}`;
}

function startRow(el, r, count) {
  const fileName = r.file;
  // Waiting behind the other read.
  setDetail(el, "wait", `${fileName} · Waiting to read`, "clock");
  const wait = r.queue && DATA !== "sparse" ? 900 : 0;
  later(() => read(el, r, count), wait);
}

function read(el, r, count) {
  el.dataset.phase = "reading";
  el.setAttribute("data-open", "");
  setDetail(el, "reading", `${r.file} · Reading now`, "spin");
  const note = el.querySelector(".note");

  later(() => { if (el.dataset.phase === "reading") { note.textContent = "Still reading. This can take up to 30 seconds."; el.setAttribute("data-open", ""); requestAnimationFrame(() => note.setAttribute("data-on", "")); } }, LONG_READ);

  later(() => {
    if (r.end === "timeout") return fail(el, r, "Reading took too long and stopped.", ["Try again"]);
    if (r.end === "lost") return lost(el, r);
    done(el, r, count);
  }, r.ms);
}

function done(el, r, count) {
  el.dataset.phase = "done";
  // The bar fills to the end, then the result line takes its place and the bar area closes.
  const hold = RM ? 0 : 260;
  later(() => {
    setDetail(el, "done", `${r.file} · ${r.rows} ${NOUN[r.s]}${r.rows === 1 ? "" : "s"}`, "check");
    el.querySelector(".note").removeAttribute("data-on");
    el.removeAttribute("data-open");
    later(() => { el.querySelector(".note").textContent = ""; }, 220);
    count();
  }, hold);
}

function lost(el, r) {
  el.dataset.phase = "stuck";
  el.setAttribute("data-stuck", "");
  // The segment stops in the middle of the track and turns grey. It does not fill.
  // (Freezing it where it was can leave it off the track, so the student sees no bar.)
  const seg = el.querySelector(".seg");
  seg.style.animation = "none";
  seg.style.transform = "translateX(89%)";
  setDetail(el, "wait", `${r.file} · Connection lost. Your file is still here.`);
  el.querySelector(".note").textContent = "";
  el.querySelector(".problem").innerHTML = '<button class="small" type="button">Try again</button>';
  el.setAttribute("data-open", "");
}

function fail(el, r, text, buttons) {
  el.dataset.phase = "failed";
  el.dataset.tone = "danger";
  el.querySelector(".track").hidden = true;
  setDetail(el, "problem", `${r.file} · ${text}`);
  el.querySelector(".note").textContent = "";
  el.setAttribute("data-open", "");
  el.querySelector(".problem").innerHTML = buttons.map((b) => `<button class="small" type="button">${b}</button>`).join("");
}

function run() {
  timers.forEach(clearTimeout); timers = [];
  for (const group of document.querySelectorAll("[data-group]")) {
    group.innerHTML = PLAN.map(rowHtml).join("");
    const counter = document.querySelector(`[data-count="${group.dataset.group}"]`);
    let read = 0;
    const count = () => { read += 1; if (counter) counter.textContent = `${read} of ${PLAN.length} read`; };
    if (counter) counter.textContent = `0 of ${PLAN.length} read`;
    [...group.children].forEach((el, i) => startRow(el, PLAN[i], count));
  }
}
document.getElementById("again").addEventListener("click", run);
run();
</script>
</body>
</html>
