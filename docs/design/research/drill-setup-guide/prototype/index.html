<!doctype html>
<!--
  PROTOTYPE, throw away. Drill setup guide (#600).
  Frame: This week in one frame. The size switch sets desktop (1440), tablet (768) or phone (390); the frame scales down to fit the window.
  The picker switches the variants of the section under review. Keys: 1-3, arrows, R.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Drill setup guide</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1F1F1F; color: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.top { height: 52px; padding: 0 24px; display: flex; align-items: center; gap: 16px; font-size: 13px; border-bottom: 1px solid #333; }
.top b { font-weight: 600; }
.top span { color: #A0A0A0; }
.data { margin-left: auto; display: flex; padding: 2px; border-radius: 8px; background: #333; }
.data button { border: 0; background: none; color: #A0A0A0; font: inherit; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.data button[aria-pressed="true"] { background: #FAFAFA; color: #111; }
.seg { display: flex; padding: 2px; border-radius: 8px; background: #333; }
.seg button { border: 0; background: none; color: #A0A0A0; font: inherit; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #FAFAFA; color: #111; }
.sizes { margin-left: auto; }
.data { margin-left: 0; }
.stage { height: calc(100% - 52px); padding: 20px 24px 88px; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }
.device { flex-shrink: 0; overflow: hidden; border-radius: 6px; }
.device iframe { transform-origin: top left; }
/* No section under review: no picker. */
.proto-picker[hidden] { display: none; }
.device iframe { display: block; border: 0; background: #F6F6F6; }
.device { box-shadow: 0 0 0 1px #000; }
.scale { color: #A0A0A0; font-size: 12px; font-variant-numeric: tabular-nums; min-width: 40px; }

.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}
</style>
</head>
<body>
<div class="top"><b>Drill setup guide · prototype</b><span id="section">No section under review. Kept: 1 Quiet, 3 Table, guide = Landscape deck, cards Slide</span>
  <div class="seg sizes" role="group" aria-label="Screen size"><button data-size="desktop">Desktop 1440</button><button data-size="tablet">Tablet 768</button><button data-size="phone">Phone 390</button></div>
  <span class="scale" id="scale"></span>
  <div class="seg data" role="group" aria-label="Data"><button data-data="demo">Demo data</button><button data-data="worst">Worst case</button></div></div>
<div class="stage" id="stage"><div class="device" id="device"><iframe title="Prototype screen"></iframe></div></div>

<nav class="proto-picker" aria-label="Prototype variants" hidden>
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const frames = [...document.querySelectorAll("iframe")];
const SIZES = { desktop: [1440, 900], tablet: [768, 1024], phone: [390, 844] };
let size = SIZES[new URLSearchParams(location.search).get("size")] ? new URLSearchParams(location.search).get("size") : "desktop";
// One frame. A new size changes the frame's width live, so the open guide stays open; the frame scales down to fit.
function fit() {
  const [w, h] = SIZES[size], stage = document.getElementById("stage"), cs = getComputedStyle(stage);
  const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const k = Math.min(1, availW / w, availH / h), f = frames[0], d = document.getElementById("device");
  f.width = w; f.height = h; f.style.transform = `scale(${k})`;
  d.style.width = `${w * k}px`; d.style.height = `${h * k}px`;
  document.getElementById("scale").textContent = `${Math.round(k * 100)}%`;
}
for (const b of document.querySelectorAll("[data-size]")) {
  b.setAttribute("aria-pressed", String(b.dataset.size === size));
  b.addEventListener("click", () => {
    size = b.dataset.size; const url = new URL(location); url.searchParams.set("size", size); history.replaceState(null, "", url);
    document.querySelectorAll("[data-size]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); fit();
  });
}
window.addEventListener("resize", fit);
fit();
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
const replay = picker.querySelector(".proto-picker-replay");
const count = items.length;
if (count) picker.hidden = false;
let current = 0;

function moveHighlight() {
  const el = items[current];
  if (!el) return;
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  const data = new URLSearchParams(location.search).get("data") === "worst" ? "&data=worst" : "";
  // The frame opens the guide for Wednesday's first drill.
  frames.forEach((f) => { f.src = `screen.html?v=${i + 1}${data}&open=2.0&t=${Date.now()}`; });
}

function setActive(i) {
  if (!count) return mount(0);
  if (i < 0 || i >= count) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set("v", i + 1);
  history.replaceState(null, "", url);
  mount(i);
}

function onKey(key) {
  const num = parseInt(key, 10);
  if (num >= 1 && num <= count) setActive(num - 1);
  else if (key === "ArrowRight") setActive((current + 1) % count);
  else if (key === "ArrowLeft") setActive((current - 1 + count) % count);
  else if (key === "r" || key === "R") mount(current);
}

items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay?.addEventListener("click", () => mount(current));
window.addEventListener("resize", moveHighlight);
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  onKey(e.key);
});
window.addEventListener("message", (e) => { if (e.data && e.data.protoKey) onKey(e.data.protoKey); });

for (const b of document.querySelectorAll("[data-data]")) {
  b.setAttribute("aria-pressed", String((new URLSearchParams(location.search).get("data") || "demo") === b.dataset.data));
  b.addEventListener("click", () => {
    const url = new URL(location); url.searchParams.set("data", b.dataset.data); history.replaceState(null, "", url);
    document.querySelectorAll("[data-data]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    mount(current);
  });
}
setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
</body>
</html>
