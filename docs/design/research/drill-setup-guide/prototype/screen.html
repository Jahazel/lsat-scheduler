<!doctype html>
<!--
  PROTOTYPE, throw away. Drill setup guide (#600).
  This week, with a "Set up" button on each drill row. The frame (index.html) shows it at 1440, 768 and 390 px.
  No build, no saved data. While a section is under review, ?v=N picks its variant.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · This week · Drill setup guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --vellum: #F6F6F6; --paper: #FFFFFF; --line: #E4E4E4; --ink: #0A0A0A; --chalk: #FAFAFA;
  --fog: #8A8A8A; --smoke: #5C5C5C; --accent: #123A94; --warning-ink: #9A6700; --success-ink: #1F7A34;
  --fast: 120ms; --base: 200ms; --slow: 320ms;
  --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1); --ease-exit: cubic-bezier(0.4, 0, 1, 1);
  font-family: Geist, ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--vellum); color: var(--ink); }
body { min-height: 100dvh; }
/* Phone platform layer: no gray flash on tap, no delay, no text selection on controls,
   and the week behind the open guide does not scroll. */
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button, a { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
html:has(dialog[open]) { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- app shell ---------- */
.nav { height: 64px; padding: 0 72px; display: flex; align-items: center; gap: 32px; background: var(--paper); border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; font-size: 18px; letter-spacing: -0.02em; }
.tabs { display: flex; gap: 4px; font-size: 14px; }
.tab { padding: 8px 14px; border-radius: 999px; color: var(--ink); }
.tab[aria-current] { background: var(--vellum); }
.nav-end { margin-left: auto; display: flex; align-items: center; gap: 20px; font-size: 14px; color: var(--smoke); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--vellum); color: var(--ink); display: grid; place-items: center; font-size: 12px; }

.header { background: var(--paper); border-bottom: 1px solid var(--line); padding: 48px 72px 40px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.header .eyebrow { margin: 0; font-size: 14px; color: var(--smoke); }
.header h1 { margin: 12px 0; font-size: 48px; line-height: 52px; font-weight: 500; letter-spacing: -0.02em; }
.header .lead { margin: 0; font-size: 20px; line-height: 30px; color: var(--smoke); }
.notes { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--smoke); }
.notes li::before { content: "ⓘ"; margin-right: 8px; }
.pace { width: 360px; flex-shrink: 0; }
.pace-top { display: flex; justify-content: space-between; align-items: baseline; }
.pace-top b { font-size: 20px; font-weight: 500; color: var(--accent); }
.pace-top span { font-size: 14px; color: var(--smoke); }
.bar { height: 8px; border-radius: 999px; background: var(--line); margin: 10px 0 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 25%; background: var(--accent); border-radius: 999px; }
.pace-bottom { display: flex; justify-content: flex-end; font-size: 14px; }

.week { padding: 64px 72px 96px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.day-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding: 0 8px; }
.day-head h2 { margin: 0; font-size: 16px; font-weight: 500; display: flex; gap: 8px; align-items: baseline; }
.day-head h2 span { font-size: 14px; font-weight: 400; color: var(--smoke); }
.day-head h2 span.today { color: var(--ink); }
.day-meta { font-size: 14px; color: var(--smoke); }
.day-empty { margin: 0; padding: 0 8px; font-size: 14px; color: var(--smoke); }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

/* ---------- activity row: toggle + optional Set up ---------- */
.row { position: relative; display: flex; align-items: flex-start; gap: 4px; min-height: 36px; border-radius: 8px; transition: background-color var(--fast) ease-out; }
@media (hover: hover) and (pointer: fine) { .row:hover { background: var(--vellum); } }
/* The grey belongs to the done toggle. On "Set up" the row stays white, so the two controls never look like one. */
@media (hover: hover) and (pointer: fine) { .row:has(.setup:hover) { background: transparent; } }
.toggle { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 2px; min-height: 36px; padding-right: 8px; text-align: left; border-radius: 8px; }
.toggle:focus-visible { outline: none; }
.toggle:focus-visible .circle { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 50%; }
.circle-slot { width: 32px; height: 36px; flex-shrink: 0; display: grid; place-items: center; }
.circle { display: flex; }
.diff { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.label { min-width: 0; flex: 1; font-size: 14px; line-height: 18px; padding: 9px 0; }
.row[data-done] .label { color: var(--smoke); text-decoration: line-through; text-decoration-color: var(--fog); }

.setup { flex-shrink: 0; white-space: nowrap; font-size: 14px; line-height: 18px; font-weight: 500; border-radius: 6px; 
  transition: color var(--fast) ease-out, background-color var(--fast) ease-out, border-color var(--fast) ease-out, opacity var(--fast) ease-out, scale var(--fast) var(--ease-out-strong); }
.setup:active { scale: 0.97; }
@media (pointer: coarse) {
  .setup { position: relative; }
  .setup::after { content: ""; position: absolute; inset: -8px -4px; }
}

/* Section 1 pick, Quiet: grey text on every drill row, quieter than the drill name. */
.setup { height: 32px; margin-top: 2px; padding: 0 10px; color: var(--smoke); }
@media (hover: hover) and (pointer: fine) { .setup:hover { color: var(--ink); } }

@media (prefers-reduced-motion: reduce) {
  .setup:active { scale: 1; }
}

/* ---------- the guide: a centered deck (replaces the section 2 card and the section 4/5 views) ---------- */
/* The owner removed the side card. "Set up" opens a centered deck over the dimmed week (from the Hilo reference).
   One card per step, picture on the left, the step and its buttons on the right. Every card has the same size:
   the card has a fixed height, the picture fits inside a fixed area, and long text scrolls inside the right column.
   Click the picture to see it at real size. */
.guide { position: fixed; inset: 0; width: 100%; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 24px; border: 0; background: transparent;
  display: flex; align-items: center; justify-content: center; color: var(--ink); opacity: 0; transition: opacity var(--fast) ease-out; }
.guide:not([open]) { display: none; }
.guide::backdrop { background: rgba(10,10,10,0.4); opacity: 0; transition: opacity var(--fast) ease-out; }
.guide[open][data-open], .guide[open][data-open]::backdrop { opacity: 1; transition-duration: var(--base); }
.deck { display: flex; width: min(1080px, 100%); height: min(680px, 100%); scale: 0.96; transition: scale var(--fast) var(--ease-out-strong); }
.guide[open][data-open] .deck { scale: 1; transition-duration: var(--base); }
.d-card { flex: 1; min-width: 0; background: var(--paper); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 24px 64px rgba(10,10,10,0.22), 0 0 0 1px rgba(10,10,10,0.06); }
.d-top { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--line); }
.d-label { flex: 1; min-width: 0; margin: 0; font-size: 13px; line-height: 18px; color: var(--smoke); }
.d-label b { font-weight: 500; color: var(--ink); }
.d-label:focus { outline: none; }
.d-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); grid-template-rows: minmax(0, 1fr); }
.close { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; color: var(--smoke);
  transition: color var(--fast) ease-out, background-color var(--fast) ease-out, scale var(--fast) var(--ease-out-strong); }
@media (hover: hover) and (pointer: fine) { .close:hover { background: var(--vellum); color: var(--ink); } }
.open7 { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none;
  transition: background-color var(--fast) ease-out, border-color var(--fast) ease-out, color var(--fast) ease-out, scale var(--fast) var(--ease-out-strong); }
.d-count { font-size: 12px; line-height: 16px; color: var(--smoke); font-variant-numeric: tabular-nums; letter-spacing: 0.1em; text-transform: uppercase; }
.d-title { margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em; }
.d-text { margin: 0; font-size: 14px; line-height: 22px; color: var(--smoke); }
.d-text b { font-weight: 500; color: var(--ink); }
.d-dots { display: flex; align-items: center; gap: 6px; }
.d-dot { width: 6px; height: 6px; padding: 0; border-radius: 999px; background: var(--line); position: relative; }
.d-dot::after { content: ""; position: absolute; inset: -9px -4px; }
.d-dot[aria-current] { width: 20px; background: var(--ink); }
.d-primary { height: 40px; padding: 0 18px; border-radius: 8px; background: var(--accent); color: var(--chalk); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
  transition: background-color var(--fast) ease-out, scale var(--fast) var(--ease-out-strong); }
@media (hover: hover) and (pointer: fine) { .d-primary:hover { background: #0E2E78; } }
.d-ghost { height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; font-weight: 500; transition: background-color var(--fast) ease-out, scale var(--fast) var(--ease-out-strong); }
@media (hover: hover) and (pointer: fine) { .d-ghost:hover { background: var(--vellum); } }
.d-ghost:disabled { opacity: 0.4; cursor: default; }
.close:active, .open7:active, .d-primary:active, .d-ghost:active:not(:disabled) { scale: 0.97; }
/* The picture area has a fixed size. The picture fits inside it and keeps its shape; a click shows it at real size and the area scrolls. */
.d-pic { position: relative; min-width: 0; overflow: hidden; background: #E9EDF6; }
.d-zoom { position: absolute; inset: 24px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: none; cursor: zoom-in; }
.d-zoom img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; border-radius: 8px; box-shadow: 0 0 0 1px rgba(10,10,10,0.08); }
.d-pic[data-zoom] { overflow: auto; overscroll-behavior: contain; }
.d-pic[data-zoom] .d-zoom { position: static; display: block; cursor: zoom-out; }
.d-pic[data-zoom] .d-zoom img { max-width: none; max-height: none; width: 1312px; border-radius: 0; }
.d-hint { display: none; }
.link-notice { margin: 24px 72px -40px; padding: 10px 16px; border-radius: 8px; background: var(--vellum); font-size: 14px; line-height: 20px; }
.link-notice[hidden] { display: none; }
.d-side { display: flex; flex-direction: column; gap: 10px; min-height: 0; padding: 24px; overflow-y: auto; overscroll-behavior: contain; border-left: 1px solid var(--line); }
.d-side .vals { margin-top: 8px; }
.d-side .open7 { align-self: stretch; }
/* The buttons stay in view while long steps scroll. */
.d-nav { position: sticky; bottom: 0; margin: auto -24px -24px; padding: 16px 24px 24px; display: flex; align-items: center; gap: 8px; background: var(--paper); }
.d-primary, .d-ghost { flex-shrink: 0; white-space: nowrap; }
.d-nav .d-dots { margin-right: auto; }

@media (max-width: 767px) {
  .guide { padding: 12px; }
  .close { width: 40px; height: 40px; }
  /* Phone: the card fills the screen; the picture area keeps one height and the steps scroll below it. */
  .d-body { display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
  .d-pic { flex-shrink: 0; height: max(140px, 100dvh - 460px); }
  .d-zoom { inset: 16px 16px 0; align-items: flex-end; }
  .d-zoom img { border-radius: 8px 8px 0 0; }
  .d-pic[data-zoom] .d-zoom img { width: 1040px; }
  /* Phone screenshots are small; the hint says a tap makes them readable. */
  .d-hint { display: block; position: absolute; top: 8px; right: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(10,10,10,0.64); color: var(--chalk); font-size: 12px; line-height: 18px; pointer-events: none; }
  .d-pic[data-zoom] .d-hint { display: none; }
  .d-side { flex: 1 0 auto; border-left: 0; padding: 16px 16px 0; overflow: visible; }
  .d-nav { margin: auto -16px 0; padding: 12px 16px; border-top: 1px solid var(--line); }
  /* A long drill name takes two lines at most; the step text names it in full. */
  .d-label { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
}
@media (prefers-reduced-motion: reduce) {
  .deck, .guide[open][data-open] .deck { scale: 1; transition: none; }
  .close:active, .open7:active, .d-primary:active, .d-ghost:active:not(:disabled) { scale: 1; }
}

/* ---------- section 3: filled-in values ---------- */
/* Section 3 pick, Table: one row per filter pass, with Tags, Difficulty and Add columns, then a total. */
.vals { display: flex; flex-direction: column; gap: 12px; container-type: inline-size; }
/* A narrow card (phone at 200% zoom): each pass stacks its values, so Add never leaves the card. */
@container (max-width: 300px) {
  .v-table thead { display: none; }
  .v-table tbody tr { display: block; padding: 10px 12px; border-top: 1px solid var(--line); }
  .v-table tbody tr:first-child { border-top: 0; }
  .v-table tbody td { display: flex; gap: 8px; padding: 2px 0; border: 0; }
  .v-table tbody td::before { content: attr(data-label); flex: 0 0 72px; font-size: 12px; color: var(--smoke); }
}
.vals-label { margin: 0; font-size: 12px; line-height: 16px; color: var(--smoke); }
.dots { display: inline-flex; gap: 2px; vertical-align: middle; margin-right: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 2px; background: var(--line); }
.dots i[data-on] { background: var(--ink); }
.v-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; line-height: 20px; }
.v-table th { text-align: left; font-weight: 400; font-size: 12px; line-height: 16px; color: var(--smoke); background: var(--vellum); padding: 8px 12px; }
.v-table td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.v-table td[data-label="Difficulty"], .v-table td.add { white-space: nowrap; font-variant-numeric: tabular-nums; }
.v-table td b { font-weight: 500; }
.v-table tfoot td { background: var(--vellum); font-size: 13px; color: var(--smoke); }
.v-table tfoot b { color: var(--ink); }
.v-section { margin: 0; font-size: 14px; line-height: 20px; }
.v-section b { font-weight: 500; }
.open7.outline { border: 1px solid var(--line); color: var(--ink); background: var(--paper); height: 40px; }
@media (hover: hover) and (pointer: fine) { .open7.outline:hover { border-color: var(--fog); } }


/* ---------- tablet ---------- */
@media (max-width: 1023px) {
  .nav { padding: 0 40px; }
  .header { padding: 48px 40px 40px; flex-direction: column; align-items: stretch; gap: 24px; }
  .pace { width: 100%; }
  .week { padding: 48px 40px 80px; }
  .link-notice { margin: 24px 40px -24px; }
}
/* ---------- phone ---------- */
@media (max-width: 767px) {
  .nav { padding: 0 20px; gap: 16px; }
  .tabs .tab:not([aria-current]), .nav-end .days { display: none; }
  .header { padding: 24px 20px; }
  .header .eyebrow { font-size: 12px; }
  .header h1 { font-size: 28px; line-height: 34px; margin: 6px 0; }
  .header .lead { font-size: 16px; line-height: 24px; }
  .week { padding: 32px 20px 64px; }
  .link-notice { margin: 16px 20px -16px; }
  .card { padding: 16px 12px; }
}
</style>
</head>
<body>
<nav class="nav" aria-label="Main">
  <span class="brand">DrillMap</span>
  <div class="tabs"><a class="tab" aria-current="page">This week</a><a class="tab">Progress</a><a class="tab">Study settings</a></div>
  <div class="nav-end"><span class="days">125 days to test</span><span class="avatar">AB</span></div>
</nav>
<header class="header">
  <div>
    <p class="eyebrow">Week of November 2</p>
    <h1>Your plan for this week</h1>
    <p class="lead">Your plan is set. Check off as you go.</p>
    <ul class="notes"><li>Necessary assumption comes first this week. You missed it most on your last practice test.</li></ul>
  </div>
  <div class="pace" aria-live="polite">
    <div class="pace-top"><b id="remaining"></b><span id="doneOf"></span></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="pace-bottom">On pace</div>
  </div>
</header>
<p class="link-notice" id="linkNotice" role="status" hidden>That drill is not in this week.</p>
<main class="week" id="week"></main>

<dialog class="guide" id="guide" aria-labelledby="guideTitle"></dialog>

<script>
const LR = (count, types, range) => ({ kind: "LR", types, questionCount: count, difficultyRange: range });
const RC = (...passages) => ({ kind: "RC", passages: passages.map(([type, difficultyLevel]) => ({ type, difficultyLevel })) });
const FULL = (section) => ({ kind: section, isFullSection: true });
const OTHER = (label) => ({ kind: "PT", label });

const DEMO_WEEK = [
  { day: "Monday", date: "Nov 2", kind: "Drilling · 1 h 28 min of 1 h 30 min", rows: [
    [LR(10, ["Necessary assumption", "Sufficient assumption"], "L2-4"), true], [RC(["Science", 3]), true]] },
  { day: "Tuesday", date: "Nov 3", kind: "Drilling · 1 h 33 min of 1 h 30 min", rows: [
    [LR(5, ["Flaw or descriptive weakening"], "L2-4"), true], [LR(5, ["Parallel flawed method of reasoning"], "L3-5"), false], [FULL("LR"), false]] },
  { day: "Wednesday", date: "Nov 4", today: true, kind: "Drilling · 1 h 34 min of 1 h 30 min", rows: [
    [LR(10, ["Strengthen", "Weaken"], "L2-4"), false], [LR(5, ["PSA - find the rule"], "L2-4"), false],
    [LR(5, ["Inference"], "L2-4"), false], [RC(["Humanities", 2], ["Law", 4]), false]] },
  { day: "Thursday", date: "Nov 5", kind: "Rest day · 0 min of 1 h 30 min", rows: [], empty: "Rest day. Nothing planned." },
  { day: "Friday", date: "Nov 6", kind: "Practice test · 3 h 8 min of 3 h 30 min", rows: [[OTHER("Practice Test (from PT 130+)"), false]] },
  { day: "Saturday", date: "Nov 7", kind: "Practice-test review · 3 h of 3 h 30 min", rows: [[OTHER("PT Review + Blind Review"), false]] },
  { day: "Sunday", date: "Nov 8", kind: "Drilling · 1 h 30 min of 1 h 30 min", rows: [[LR(5, ["Must be true"], "L3-5"), false]] },
];

// Worst case: the longest real type names and pairs (tutor pairs in src/lib/mockData.ts), 10-question pairs, top levels.
const WORST_WEEK = [
  { day: "Monday", date: "Nov 2", kind: "Drilling · 1 h 45 min of 1 h 30 min", rows: [
    [LR(10, ["Flaw or descriptive weakening", "Weaken"], "L3-5"), true]] },
  { day: "Tuesday", date: "Nov 3", kind: "Not scheduled · 0 min of 1 h 30 min", rows: [], empty: "Not scheduled because this weekly schedule started Wednesday." },
  { day: "Wednesday", date: "Nov 4", today: true, kind: "Drilling · 2 h 4 min of 1 h 30 min", rows: [
    [LR(10, ["Parallel flawed method of reasoning", "Parallel method of reasoning"], "L3-5"), false],
    [LR(5, ["PSA - find or complete the application"], "L3-5"), true],
    [LR(5, ["Lack of support v. false conclusion"], "L2-4"), false],
    [RC(["Comparative", 5], ["Humanities", 3]), false]] },
  { day: "Thursday", date: "Nov 5", kind: "Drilling · 15 min of 30 min", rows: [[RC(["Art", 2]), false]] },
  { day: "Friday", date: "Nov 6", kind: "Practice test · 3 h 8 min of 3 h 30 min", rows: [[OTHER("Practice Test (from PT 130+)"), false]] },
  { day: "Saturday", date: "Nov 7", kind: "Practice-test review · 3 h of 3 h 30 min", rows: [[OTHER("PT Review + Blind Review"), false], [FULL("RC"), false]] },
  { day: "Sunday", date: "Nov 8", kind: "Rest day · 0 min of 1 h 30 min", rows: [], empty: "Rest day. Nothing planned." },
];
const WEEK = new URLSearchParams(location.search).get("data") === "worst" ? WORST_WEEK : DEMO_WEEK;

// Same rules as src/lib/activityLabel.ts.
function lrTypesName(types) {
  if (types.length === 1) return types[0];
  const [a, b] = types.map((t) => t.split(" "));
  const shares = a.length === 2 && b.length === 2 && a[1] === b[1];
  return `${shares ? a[0] : types[0]} + ${types[1]}`;
}
function activityLabel(a) {
  if (a.isFullSection) return `1 Full ${a.kind} Section`;
  if (a.kind === "LR") return `${a.questionCount} ${lrTypesName(a.types)} (${a.difficultyRange})`;
  if (a.kind === "RC") {
    const p = a.passages.toSorted((x, y) => x.difficultyLevel - y.difficultyLevel).map(({ type, difficultyLevel }) => `${type} L${difficultyLevel}`).join(", ");
    return a.passages.length === 1 ? `1 RC Passage ${p}` : `2 RC Passages ${p}`;
  }
  return a.label;
}
// A difficulty such as "(L2-4)" never breaks across lines.
const labelHtml = (label) => label.replace(/\((L\d-\d)\)$/, '<span class="diff">($1)</span>');
const hasGuide = (a) => (a.kind === "LR" || a.kind === "RC") && !a.isFullSection;

// The step texts. They repeat the table's values in words, so step 4 reads alone.
function guideSteps(a) {
  const section = a.kind === "LR" ? "Logical Reasoning" : "Reading Comprehension";
  const ps = passes(a), unit = (x) => x.unit === "passage" ? "passage" : "questions";
  const set = (x) => `set Tags to <b>${x.tag}</b> and Difficulty to <b>${levels(x)}</b>`;
  const filter = ps.length === 1
    ? `${cap(set(ps[0]))}. Click <b>Add</b> on <b>${ps[0].add}</b> ${unit(ps[0])}.`
    : `${cap(set(ps[0]))}. Click <b>Add</b> on <b>${ps[0].add}</b> ${unit(ps[0])}. Then ${set(ps[1])}, and add <b>${ps[1].add}</b> more.`;
  const total = a.kind === "LR" ? `${a.questionCount} questions` : `${ps.length} passage${ps.length > 1 ? "s" : ""}`;
  return [
    "Open 7Sage. Go to Study, then Practice, then <b>Drills</b>.",
    `Under <b>${section}</b>, click <b>New drill</b>.`,
    "Skip the adaptive drill. Click <b>Customize</b>.",
    filter,
    `Check that it says <b>${total} selected</b>. Click <b>Save &amp; share</b>, then start the drill.`,
  ];
}
const cap = (t) => t[0].toUpperCase() + t.slice(1);
const params = new URLSearchParams(location.search);
document.body.dataset.v = params.get("v") || "1";

const OPEN = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="7.4" fill="none" stroke="#5C5C5C" stroke-width="1.2"/></svg>';
const DONE = '<svg viewBox="0 0 14 14" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="#0A0A0A"/><path d="M4.1 7.2l2 2 3.8-4.1" fill="none" stroke="#FAFAFA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function render() {
  const week = document.getElementById("week");
  week.innerHTML = WEEK.map((d, di) => `
    <section><div class="card">
      <div class="day-head"><h2>${d.day} <span class="${d.today ? "today" : ""}">${d.today ? "Today, " : ""}${d.date}</span></h2><span class="day-meta">${d.kind}</span></div>
      ${d.rows.length === 0 ? `<p class="day-empty">${d.empty}</p>` : `<ul class="rows">${d.rows.map(([a, done], ri) => {
        const label = activityLabel(a);
        return `<li class="row" ${done ? "data-done" : ""}>
          <button class="toggle" role="checkbox" aria-checked="${done}" data-toggle="${di}.${ri}">
            <span class="circle-slot"><span class="circle">${done ? DONE : OPEN}</span></span><span class="label">${labelHtml(label)}</span>
          </button>
          ${hasGuide(a) ? `<button class="setup" data-setup="${di}.${ri}" aria-haspopup="dialog" aria-expanded="false" aria-label="Set up ${label} on 7Sage">Set up</button>` : ""}
        </li>`;
      }).join("")}</ul>`}
    </div></section>`).join("");
  const all = WEEK.flatMap((d) => d.rows), done = all.filter(([, x]) => x).length;
  document.getElementById("remaining").textContent = `${all.length - done} remaining`;
  document.getElementById("doneOf").textContent = `${done} of ${all.length} done`;
  document.getElementById("barFill").style.width = `${(done / all.length) * 100}%`;
}
render();

const at = (key) => { const [d, r] = key.split(".").map(Number); return WEEK[d].rows[r]; };
document.getElementById("week").addEventListener("click", (e) => {
  const t = e.target.closest("[data-toggle]");
  if (t) { const row = at(t.dataset.toggle); row[1] = !row[1]; const key = t.dataset.toggle; render(); document.querySelector(`[data-toggle="${key}"]`).focus(); return; }
  const s = e.target.closest("[data-setup]");
  if (s) openGuide(s);
});

const SLIDES = ["step-1-open-drills", "step-2-new-drill", "step-3-customize", "step-4-filter-and-add", "step-5-review-and-save"];
// Placeholder link: the 7Sage Drills page address is not confirmed.
const SEVEN_SAGE = "https://7sage.com/";
const EXTERNAL = '<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M4 2.5h5.5V8M9.5 2.5L3 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CLOSE = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';


const guide = document.getElementById("guide");
let opener = null;


// One filter pass per LR type or RC passage. RC tags and every difficulty are guesses until the tutor answers.
function passes(a) {
  if (a.kind === "LR") {
    const [lo, hi] = a.difficultyRange.replace("L", "").split("-").map(Number);
    return a.types.map((t) => ({ tag: t, lo, hi, add: a.types.length === 2 ? a.questionCount / 2 : a.questionCount, unit: "questions" }));
  }
  return a.passages.map((p) => ({ tag: p.type, lo: p.difficultyLevel, hi: p.difficultyLevel, add: 1, unit: "passage" }));
}
const dotsHtml = (lo, hi) => `<span class="dots" aria-hidden="true">${[1, 2, 3, 4, 5].map((n) => `<i ${n >= lo && n <= hi ? "data-on" : ""}></i>`).join("")}</span>`;
const levels = (x) => x.lo === x.hi ? `${x.lo}` : `${x.lo} to ${x.hi}`;
const GUESS = '<span class="guess">(guess)</span>';
function valuesHtml(a) {
  const section = a.kind === "LR" ? "Logical Reasoning" : "Reading Comprehension";
  const ps = passes(a), total = a.kind === "LR" ? `${a.questionCount} questions` : `${ps.length} passage${ps.length > 1 ? "s" : ""}`;
  const link = `<a class="open7 outline" href="${SEVEN_SAGE}" target="_blank" rel="noopener">Open 7Sage drills ${EXTERNAL}<span class="sr-only"> (opens in a new tab)</span></a>`;
  const rows = ps.map((x) => `<tr><td data-label="Tags"><b>${x.tag}</b></td><td data-label="Difficulty">${dotsHtml(x.lo, x.hi)}${levels(x)}</td><td class="add" data-label="Add">${x.add}</td></tr>`).join("");
  return `<div class="vals"><p class="vals-label">Your filters on 7Sage</p><p class="v-section">Section: <b>${section}</b></p>
    <table class="v-table"><thead><tr><th>Tags${a.kind === "RC" ? ` ${GUESS}` : ""}</th><th>Difficulty ${GUESS}</th><th>Add</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="3">Total: <b>${total}</b></td></tr></tfoot></table>${link}</div>`;
}
// ---------- the guide: a centered deck ----------
const ARROW = (d) => `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="${d === "prev" ? "M10 3.5 5.5 8l4.5 4.5" : "M6 3.5 10.5 8 6 12.5"}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
// Short step names, from the brief's Pictures table.
const STEP_TITLES = ["Open Drills on 7Sage", "Start a new drill", "Choose Customize", "Filter and add questions", "Check the count and save"];
let deckKey = null, deckIdx = 0;
const CARDS = STEP_TITLES.length;
function deckHtml() {
  const [d] = deckKey.split(".").map(Number), [a] = at(deckKey), c = deckIdx, last = c === CARDS - 1;
  const label = `<p class="d-label" id="guideTitle" tabindex="-1">Drill setup guide · ${WEEK[d].day} · <b>${labelHtml(activityLabel(a))}</b></p>`;
  const top = `<div class="d-top">${label}<button class="close" data-close aria-label="Close the drill setup guide">${CLOSE}</button></div>`;
  const dots = `<div class="d-dots">${STEP_TITLES.map((_, j) => `<button class="d-dot" data-goto="${j}" aria-label="Step ${j + 1}"${j === c ? ' aria-current="step"' : ""}></button>`).join("")}</div>`;
  const next = last ? `<button class="d-primary" data-close>Done</button>` : `<button class="d-primary" data-step="1">Next step ${ARROW("next")}</button>`;
  const back = `<button class="d-ghost" data-step="-1" ${c === 0 ? "disabled" : ""}>Back</button>`;
  const pic = `<div class="d-pic"><button class="d-zoom" data-zoomer aria-pressed="false" aria-label="Show the screenshot at real size"><img src="../slides/${SLIDES[c]}.png" alt="7Sage, step ${c + 1}"></button><span class="d-hint" aria-hidden="true">Tap to zoom</span></div>`;
  // Step 4 shows the filters; the filters table carries its own "Open 7Sage drills" button.
  const extra = c === 3 ? valuesHtml(a) : `<a class="open7 outline" href="${SEVEN_SAGE}" target="_blank" rel="noopener">Open 7Sage drills ${EXTERNAL}<span class="sr-only"> (opens in a new tab)</span></a>`;
  return `<div class="deck"><div class="d-card">${top}<div class="d-body">${pic}<div class="d-side"><span class="d-count">Step ${c + 1} of ${CARDS}</span>
    <h3 class="d-title">${STEP_TITLES[c]}</h3><p class="d-text">${guideSteps(a)[c]}</p>${extra}<div class="d-nav">${dots}${back}${next}</div></div></div></div></div>`;
}
// Moving between cards: the new screenshot and step text slide 12 px in from the side the student moves to, and fade in.
// 200 ms (--duration-base); the text follows the screenshot by 40 ms. The card, header and buttons stay still. Reduced motion: fade only.
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
function cardMotion(dir) {
  const move = !reduceMotion.matches;
  const parts = [guide.querySelector(".d-zoom img"), ...guide.querySelectorAll(".d-side > :not(.d-nav)")];
  parts.forEach((el, n) => el.animate(
    [{ opacity: 0, transform: `translateX(${move ? dir * 12 : 0}px)` }, { opacity: 1, transform: "translateX(0)" }],
    { duration: 200, delay: n ? 40 : 0, easing: "cubic-bezier(0.23, 1, 0.32, 1)", fill: "backwards" }));
}
function showCard(i, focusSel, still = false) {
  const prev = deckIdx;
  deckIdx = Math.max(0, Math.min(CARDS - 1, i));
  guide.innerHTML = deckHtml();
  if (guide.hasAttribute("data-open") && prev !== deckIdx && !still) cardMotion(Math.sign(deckIdx - prev));
  const el = focusSel && [...guide.querySelectorAll(focusSel)].find((b) => b.offsetParent);
  (el || document.getElementById("guideTitle")).focus({ preventScroll: true });
}
function openGuide(button, start = 0) {
  opener = button; deckKey = button.dataset.setup;
  // Load all five screenshots now, so moving between cards never shows an empty picture.
  SLIDES.forEach((sl) => { new Image().src = `../slides/${sl}.png`; });
  button.setAttribute("aria-expanded", "true");
  // One history entry per open guide, so the browser's Back closes the guide and stays on This week.
  history.pushState({ guide: deckKey }, ""); pushed = true;
  guide.showModal(); showCard(start);
  requestAnimationFrame(() => requestAnimationFrame(() => guide.setAttribute("data-open", "")));
}
let pushed = false;
function closeGuide(fromBack = false) {
  if (!guide.open || !guide.hasAttribute("data-open")) return;
  guide.removeAttribute("data-open");
  // Closing another way takes the guide's history entry back off, so Back after a close does not reopen it.
  if (pushed && !fromBack) history.back();
  pushed = false;
  opener?.setAttribute("aria-expanded", "false");
  // The week stays inert until the dialog closes, so focus returns to "Set up" after close().
  setTimeout(() => { if (guide.hasAttribute("data-open")) return; guide.close(); opener?.focus({ preventScroll: true });
    // A link that opened the guide is used up: closing removes it, so a reload shows the week.
    const u = new URL(location); if (u.searchParams.has("open")) { u.searchParams.delete("open"); u.searchParams.delete("card"); history.replaceState(history.state, "", u); } }, 120);
}
guide.addEventListener("cancel", (e) => { e.preventDefault(); closeGuide(); });
guide.addEventListener("click", (e) => {
  const step = e.target.closest("[data-step]");
  if (step && !step.disabled) return showCard(deckIdx + Number(step.dataset.step), `[data-step="${step.dataset.step}"]:not([disabled]), .d-primary`);
  const go = e.target.closest("[data-goto]");
  if (go) return showCard(Number(go.dataset.goto), `[data-goto="${go.dataset.goto}"]`);
  const z = e.target.closest("[data-zoomer]");
  if (z) { const pic = z.closest(".d-pic"), on = !pic.hasAttribute("data-zoom");
    pic.toggleAttribute("data-zoom", on); z.setAttribute("aria-pressed", String(on));
    z.setAttribute("aria-label", on ? "Fit the screenshot" : "Show the screenshot at real size"); return; }
  // A click on the dimmed week around the deck closes the guide.
  if (e.target.closest("[data-close]") || e.target === guide) closeGuide();
});
guide.addEventListener("keydown", (e) => {
  // A held arrow key repeats fast; those repeats change the card without motion.
  if (e.key === "ArrowLeft") showCard(deckIdx - 1, null, e.repeat);
  if (e.key === "ArrowRight") showCard(deckIdx + 1, null, e.repeat);
});
document.addEventListener("keydown", (e) => {
  // Let the frame's variant picker hear keys pressed inside this screen.
  if (parent !== window && !guide.open && !e.metaKey && !e.ctrlKey && !e.altKey && /^([1-9]|ArrowLeft|ArrowRight|r|R)$/.test(e.key))
    parent.postMessage({ protoKey: e.key }, "*");
});

window.addEventListener("popstate", () => { if (pushed) closeGuide(true); });
// A link names one drill. A drill that is not in this week shows a notice instead of the guide.
if (params.get("open")) {
  const linked = document.querySelector(`[data-setup="${params.get("open")}"]`);
  if (linked) openGuide(linked, Number(params.get("card") || 0));
  else document.getElementById("linkNotice").hidden = false;
}
</script>
</body>
</html>
